apiVersion: 1
# Recreate on every start so the fixed uid below (referenced by the dashboards)
# also applies to Grafana volumes that stored an auto-generated uid.
deleteDatasources:
  - name: Prometheus
    orgId: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
