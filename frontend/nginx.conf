server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /predict {
        proxy_pass http://api:8000;
    }

    location /model {
        proxy_pass http://api:8000;
    }

    location /metrics {
        proxy_pass http://api:8000;
    }
}
